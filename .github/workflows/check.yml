name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: ruff check plugins tests
      - run: ruff format --check plugins tests
      - run: ty check plugins tests
      - run: python -m unittest tests/test_server.py -v

  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify the configured plugin launcher
        run: python3 --version
      - name: Run tests with a live managed tgrep download
        env:
          TGREP_LIVE_TEST: "1"
        run: python -m unittest discover -s tests -v
      - run: python -m compileall -q plugins tests
