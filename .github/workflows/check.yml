name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: ruff check plugins tests
      - run: ruff format --check plugins tests
      - run: ty check plugins tests
      - run: python -m unittest tests/test_server.py -v

  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Provide the documented python3 launcher on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          Copy-Item $python (Join-Path (Split-Path $python) "python3.exe")
      - name: Verify the configured plugin launcher
        run: python3 --version
      - name: Run tests with a live managed tgrep download
        env:
          TGREP_LIVE_TEST: "1"
        run: python -m unittest discover -s tests -v
      - run: python -m compileall -q plugins tests
